name: Disclosure Tracker

# Daily: pull new congressional + 13F disclosures, update prices, rebuild
# per-person track records / clusters, and publish the report JSON to the
# `tracker-data` branch (a single force-pushed commit, so the repo doesn't
# grow by a few MB every day).

on:
  schedule:
    - cron: '17 11 * * *'   # ~7:17 AM Toronto (EDT), every day
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'Max Capitol Trades pages (only used with --with-capitoltrades)'
        default: '600'

permissions:
  contents: write   # to publish the report on the tracker-data branch
  actions: write    # cache read/write

concurrency:
  group: disclosure-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    # The first run backfills ~a decade of filings and prices; later runs take minutes.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements-lock.txt') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Install dependencies (pinned)
        run: pip install -r requirements-lock.txt

      - name: Restore tracker database
        uses: actions/cache/restore@v4
        with:
          path: tracker.db
          key: tracker-db-v3-${{ runner.os }}-${{ github.run_id }}
          restore-keys: tracker-db-v3-${{ runner.os }}-

      # Previous report is needed so alerts only mention what's new
      - name: Fetch previous report
        run: |
          mkdir -p reports
          git fetch --depth 1 origin tracker-data:tracker-data 2>/dev/null \
            && git show tracker-data:smart_money_report.json > reports/smart_money_report.json \
            || echo "No previous report yet"

      - name: Update data and build report
        env:
          TRACKER_DATABASE_URL: sqlite:///./tracker.db
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python -m src.tracker all --max-pages "${{ github.event.inputs.max_pages || '600' }}"

      - name: Save tracker database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: tracker.db
          key: tracker-db-v3-${{ runner.os }}-${{ github.run_id }}

      # Runs even when the update failed, so diagnostics are always visible
      - name: Publish report to tracker-data branch
        if: always()
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          for f in smart_money_report.json tracker_run.json tracker_error.txt; do
            cp "reports/$f" "$tmp/" 2>/dev/null || true
          done
          cd "$tmp"
          git init -q -b tracker-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '# tracker-data\n\nGenerated by the Disclosure Tracker workflow. Overwritten on every run.\n' > README.md
          git add .
          git commit -q -m "Tracker report $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" tracker-data
